schema: spec-driven

context: |
  Tech stack: Node.js/Express API on port 3000, Postgres via Supabase (hosted),
  future migration target: self-hosted Postgres on a VPS.
  Domain: order-fulfillment automation for a print/production business receiving
  orders from multiple e-commerce platforms (Shopee, Lazada, more TBD) and customer
  messages from multiple channels (WhatsApp, Email, Shopee Chat, Lazada Chat).
  Core tables: orders, order_items, messages, files (attachment metadata; actual
  files live on NAS/local network storage, not in the DB).
  Every schema/design decision must cite a real doc/source — see /study.
  No auth on the port-3000 API for now (internal network only, explicit choice).

