<svg width="640" height="650" viewBox="0 0 640 650" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="black"/>
</marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:black;}
.title{font-size:16px;font-weight:bold;text-anchor:middle;}
.label{font-size:13px;text-anchor:middle;}
.small{font-size:11px;text-anchor:middle;}
.box{fill:white;stroke:black;stroke-width:1.5;}
.diamond{fill:white;stroke:black;stroke-width:1.5;}
.edge{stroke:black;stroke-width:1.5;fill:none;}
</style>

<text x="320" y="20" class="title">UML activity diagram — validation &amp; matching</text>

<circle cx="320" cy="50" r="8" fill="black"/>
<text x="320" y="42" class="small">File downloaded</text>
<line x1="320" y1="58" x2="320" y2="90" class="edge" marker-end="url(#arrow)"/>

<rect x="210" y="90" width="220" height="50" rx="20" class="box"/>
<text x="320" y="120" class="label">Check MIME/extension</text>

<line x1="320" y1="140" x2="320" y2="170" class="edge" marker-end="url(#arrow)"/>

<polygon points="320,170 410,210 320,250 230,210" class="diamond"/>
<text x="320" y="214" class="small">Supported type?</text>

<text x="345" y="270" class="small">[Yes]</text>
<line x1="320" y1="250" x2="320" y2="290" class="edge" marker-end="url(#arrow)"/>

<text x="450" y="200" class="small">[No]</text>
<line x1="410" y1="210" x2="470" y2="210" class="edge" marker-end="url(#arrow)"/>
<rect x="470" y="188" width="150" height="44" rx="20" class="box"/>
<text x="545" y="215" class="label">Reject &amp; log</text>
<line x1="545" y1="232" x2="545" y2="256" class="edge" marker-end="url(#arrow)"/>
<circle cx="545" cy="270" r="12" class="box"/>
<circle cx="545" cy="270" r="6" fill="black"/>

<rect x="200" y="290" width="240" height="60" rx="20" class="box"/>
<text x="320" y="316" class="label">Match to order</text>
<text x="320" y="334" class="small">Query orders DB</text>

<line x1="320" y1="350" x2="320" y2="380" class="edge" marker-end="url(#arrow)"/>

<polygon points="320,380 410,420 320,460 230,420" class="diamond"/>
<text x="320" y="424" class="small">Match found?</text>

<text x="345" y="480" class="small">[Yes]</text>
<line x1="320" y1="460" x2="320" y2="500" class="edge" marker-end="url(#arrow)"/>

<text x="450" y="410" class="small">[No]</text>
<line x1="410" y1="420" x2="470" y2="420" class="edge" marker-end="url(#arrow)"/>
<rect x="470" y="398" width="150" height="44" rx="20" class="box"/>
<text x="545" y="425" class="label">Flag manual match</text>
<line x1="545" y1="442" x2="545" y2="466" class="edge" marker-end="url(#arrow)"/>
<circle cx="545" cy="480" r="12" class="box"/>
<circle cx="545" cy="480" r="6" fill="black"/>

<rect x="200" y="500" width="240" height="60" rx="20" class="box"/>
<text x="320" y="526" class="label">Duplicate check</text>
<text x="320" y="544" class="small">SHA256 file hash</text>

<line x1="320" y1="560" x2="320" y2="590" class="edge" marker-end="url(#arrow)"/>

<circle cx="320" cy="604" r="12" class="box"/>
<circle cx="320" cy="604" r="6" fill="black"/>
<text x="320" y="630" class="small">Continues to storage &amp; notification flow</text>

</svg>
